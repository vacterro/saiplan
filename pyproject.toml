[project]
name = "saiplan"
version = "0.1.1"
description = "SAIPLAN - lightweight portable Windows planner, SAIPEN-style"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.8.0",
]

[project.optional-dependencies]
build = ["nuitka>=4.1.2"]
dev = ["pytest>=8.4.2", "ruff>=0.16.0"]

[project.scripts]
saiplan = "saiplan.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saiplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running subprocess smoke tests (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
